<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Неонове світіння для центрального AI-ядра -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Металевий градієнт для верхньої частини захисного купола -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
  </defs>

  <!-- Базовий темний фон (як на сайті) -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  
  <!-- Внутрішня панель (імітує картки інтерфейсу dApp) -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="#141414" stroke="#262626" stroke-width="4"/>

  <!-- Зовнішній шестикутник (Символ Домену) -->
  <polygon points="256,80 408,168 408,344 256,432 104,344 104,168" fill="none" stroke="#262626" stroke-width="20" stroke-linejoin="round"/>
  
  <!-- Білий акцент (Символізує захист / Щит) -->
  <path d="M104 168 L256 80 L408 168" fill="none" stroke="url(#shieldGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Центральна AI-іскра (GenVM Consensus) з неоновим світінням сайту -->
  <path d="M256 160 C256 240 240 256 160 256 C240 256 256 272 256 352 C256 272 272 256 352 256 C272 256 256 240 256 160 Z" fill="#d4f938" filter="url(#neon-glow)"/>
  
  <!-- Темне ядро всередині іскри -->
  <circle cx="256" cy="256" r="14" fill="#141414"/>
</svg>
